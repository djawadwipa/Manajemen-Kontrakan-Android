name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, contoh 1.0.0
        required: true
        default: 0.1.0
      version_code:
        description: Version code integer dan selalu naik
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup pinned Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Verify native-only and security invariants
        run: ./scripts/verify-native-only.sh

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.version_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "${{ inputs.version_code }}" =~ ^[1-9][0-9]*$ ]]

      - name: Decode and validate private keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          chmod 600 "$RELEASE_STORE_FILE"
          keytool -list -keystore "$RELEASE_STORE_FILE" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null

      - name: Test, lint, build signed APK and AAB
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=1 --warning-mode=all
          -PversionName=${{ inputs.version_name }}
          -PversionCode=${{ inputs.version_code }}
          clean test lintRelease assembleRelease bundleRelease

      - name: Verify APK and AAB signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk \
            | tee app/build/outputs/apk/release/signature-report.txt
          jarsigner -verify -verbose -certs \
            app/build/outputs/bundle/release/app-release.aab \
            > app/build/outputs/bundle/release/signature-report.txt

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs
          sha256sum \
            apk/release/app-release.apk \
            bundle/release/app-release.aab \
            > SHA256SUMS.txt

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: manajemen-kontrakan-v${{ inputs.version_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/signature-report.txt
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/signature-report.txt
            app/build/outputs/SHA256SUMS.txt
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.html

      - name: Remove private keystore
        if: always()
        run: rm -f "$RELEASE_STORE_FILE"
